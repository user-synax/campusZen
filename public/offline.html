<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline — CampusZen</title>
    <style>
        :root {
            --bg: #0e0e12;
            --surface: #17171d;
            --border: #2a2a33;
            --text: #f4f4f6;
            --text-dim: #9797a3;
            --accent: #7c5cff;
            --accent-dim: #4a3b8f;
            --shadow-color: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(124, 92, 255, 0.08), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(124, 92, 255, 0.05), transparent 40%);
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 8px 8px 0 var(--shadow-color);
            text-align: center;
        }

        .status-dot-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: var(--bg);
            border: 2px solid var(--border);
            box-shadow: 4px 4px 0 var(--shadow-color);
            margin-bottom: 24px;
        }

        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(0.75);
            }
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-dim);
            margin-bottom: 28px;
        }

        .eyebrow {
            font-family: "SF Mono", ui-monospace, "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 12px;
            display: block;
        }

        button {
            width: 100%;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            color: var(--text);
            background: var(--accent-dim);
            border: 2px solid var(--accent);
            border-radius: 14px;
            padding: 14px 20px;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--shadow-color);
            transition: box-shadow 0.15s ease, transform 0.15s ease;
        }

        button:active {
            box-shadow: 1px 1px 0 var(--shadow-color);
            transform: translate(3px, 3px);
        }

        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .hint {
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .hint strong {
            color: var(--text);
            font-weight: 600;
        }

        @media (prefers-reduced-motion: reduce) {
            .status-dot {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="status-dot-wrap">
            <div class="status-dot"></div>
        </div>
        <span class="eyebrow">Connection lost</span>
        <h1>You're offline</h1>
        <p>CampusZen needs an internet connection. Reconnect and try again — nothing you were doing has been lost.</p>
        <button onclick="location.reload()">Try again</button>
        <div class="hint">Will reload automatically once you're back <strong>online</strong>.</div>
    </div>

    <script>
        window.addEventListener("online", () => {
            location.reload();
        });
    </script>
</body>

</html>
